name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Test Gateway logic
        run: npm run test:gateway
      - name: Test audio chunking
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows installer
        run: npm run tauri:build -- --bundles nsis
      - name: Check installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one setup EXE; found $($installers.Count)" }
          if ($installers[0].Length -lt 1MB) { throw 'Setup EXE is unexpectedly small' }
          Write-Output "$($installers[0].Name): $($installers[0].Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: typeless-client-v2.0.4-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
